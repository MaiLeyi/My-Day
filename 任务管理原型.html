<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任务管理 · 原型 v3</title>
<style>
  :root{
    --bg:#f5f5f6; --panel:#ffffff; --line:#e6e6e9; --line2:#f0f0f2;
    --text:#3f3f46; --sub:#8b8b94; --sub2:#b3b3bb;
    --ink:#4b4b55; --ink-soft:#f1f1f3; --ink-line:#dcdce0;
    --gray1:#f3f3f5; --gray2:#eaeaec; --gray3:#dedee1;
    --field:#fff; --on-ink:#fff; --hover:#fafafa;
    --shadow:0 6px 24px rgba(0,0,0,.05);
  }
  [data-theme="warm"]{
    --bg:#f6f3ee; --panel:#fffdf9; --line:#e9e1d5; --line2:#f1ece3;
    --text:#4a4238; --sub:#93887a; --sub2:#bdb3a4;
    --ink:#6b5d4b; --ink-soft:#f3ede3; --ink-line:#e2d6c4;
    --gray1:#f2ece2; --gray2:#e9e0d1; --gray3:#ddd2bf;
    --field:#fffdf9; --on-ink:#fff; --hover:#faf6ef;
    --shadow:0 6px 24px rgba(120,100,70,.08);
  }
  [data-theme="blue"]{
    --bg:#f2f5f8; --panel:#ffffff; --line:#e2e8ee; --line2:#eef2f6;
    --text:#3c4652; --sub:#82909d; --sub2:#b4bfc9;
    --ink:#4a6478; --ink-soft:#eef2f6; --ink-line:#d6dee6;
    --gray1:#f0f3f6; --gray2:#e6ebef; --gray3:#d9dfe5;
    --field:#fff; --on-ink:#fff; --hover:#f7fafc;
    --shadow:0 6px 24px rgba(60,90,110,.08);
  }
  [data-theme="dark"]{
    --bg:#1f2023; --panel:#28292d; --line:#3a3b40; --line2:#323338;
    --text:#e6e6e9; --sub:#a0a1a8; --sub2:#6f7076;
    --ink:#e6e6e9; --ink-soft:#323338; --ink-line:#45464b;
    --gray1:#303136; --gray2:#38393e; --gray3:#424348;
    --field:#2d2e32; --on-ink:#1f2023; --hover:#303136;
    --shadow:0 6px 24px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:14px}

  /* ===== 顶部 ===== */
  .topbar{position:relative;height:56px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;z-index:20}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;white-space:nowrap}
  .brand .logo{width:28px;height:28px;border-radius:7px;background:var(--ink);color:var(--on-ink);display:flex;align-items:center;justify-content:center;font-size:14px}
  .menu-btn{display:none;width:34px;height:34px;border-radius:8px;font-size:18px;background:var(--gray1)}
  .search{position:absolute;left:50%;transform:translateX(-50%);width:320px;max-width:40vw;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 12px}
  .search input{flex:1;border:none;background:none;outline:none}
  .search .q{color:var(--sub)}
  .topbar .spacer{flex:1}
  .seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
  .seg button{padding:6px 14px;border-radius:8px;font-size:13.5px;color:var(--sub)}
  .seg button.active{background:var(--ink);color:var(--on-ink);font-weight:500}
  .btn{padding:8px 14px;border-radius:10px;font-size:13.5px;display:flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid transparent}
  .btn-pri{background:var(--ink);color:var(--on-ink)}
  .btn-ghost{background:var(--field);border:1px solid var(--line)}
  .btn-ghost:hover{background:var(--gray1)}
  .btn-danger{background:var(--gray1)}
  .toolbar-actions{display:flex;align-items:center;gap:8px}
  .batchbar{display:none;align-items:center;gap:12px;font-size:13.5px;color:var(--sub)}
  body.batch .batchbar{display:flex}
  body.batch .seg,body.batch .search{opacity:.5;pointer-events:none}

  /* ===== 布局 ===== */
  .layout{flex:1;display:flex;overflow:hidden}

  /* ===== 左侧导航 ===== */
  .sidebar{width:290px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;transition:margin .2s;overflow:hidden}
  .usercard{display:flex;align-items:center;gap:12px;padding:16px 16px 8px}
  .avatar{width:38px;height:38px;border-radius:11px;background:var(--ink);color:var(--on-ink);display:flex;align-items:center;justify-content:center;font-weight:600}
  .usercard .un{font-weight:600}.usercard .ur{font-size:12.5px;color:var(--sub)}
  .side-actions{padding:6px 14px;display:flex;gap:8px}
  .side-actions .btn{flex:1;justify-content:center}
  .side-tools{padding:4px 14px 8px;display:flex;gap:8px}
  .side-tools .btn{flex:1;justify-content:center}
  .tree{flex:1;overflow-y:auto;padding:6px 10px 20px}
  .pnode,.fnode{user-select:none}
  .row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;cursor:pointer;font-size:14px;position:relative}
  .row:hover{background:var(--gray1)}
  .row.active{background:var(--ink-soft)}
  .row.drag-over{outline:1.5px dashed var(--ink-line);outline-offset:-2px}
  .tnode.drag-over{outline:1.5px dashed var(--ink-line);outline-offset:-2px}
  .caret{font-size:10px;color:var(--sub);width:14px;transition:transform .15s;display:inline-block}
  .pnode.open>.row .caret{transform:rotate(90deg)}
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--gray3)}
  .pname{font-weight:600;flex:1}
  .fnode{margin-left:18px}
  .f-icon{width:14px;text-align:center;color:var(--sub2);font-size:13px;flex-shrink:0}
  .fnode>.row{color:var(--text);font-size:13.5px}
  .sub2{margin-left:14px}
  .tnode{padding:6px 10px;border-radius:9px;cursor:pointer;font-size:13px;color:var(--text);display:flex;align-items:center;gap:8px}
  .tnode:hover{background:var(--gray1)}
  .tnode.active{background:var(--ink-soft)}
  .tnode.done .tt{text-decoration:line-through;color:var(--sub2)}
  .tdot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink-line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--on-ink)}
  .tdot.doing{background:var(--gray2);border-color:var(--gray2)}
  .tdot.done{background:var(--ink);border-color:var(--ink)}
  .tn-actions{display:none;margin-left:auto;gap:2px}
  .tnode:hover .tn-actions{display:flex}
  .tn-actions .mini{width:22px;height:22px;border-radius:6px;font-size:13px;color:var(--sub);display:flex;align-items:center;justify-content:center}
  .tn-actions .mini:hover{background:var(--gray2);color:var(--text)}
  .count{font-size:11.5px;color:var(--sub);background:var(--gray1);border-radius:8px;padding:1px 7px}
  .sub{margin-left:14px;display:none}
  .pnode.open>.sub{display:block}
  .row-actions{display:none;gap:2px;margin-left:auto}
  .row:hover>.row-actions{display:flex}
  .row-actions .mini{width:22px;height:22px;border-radius:6px;font-size:13px;color:var(--sub);display:flex;align-items:center;justify-content:center}
  .row-actions .mini:hover{background:var(--gray2);color:var(--text)}
  .add-proj{margin:8px 10px;padding:8px;border:1px dashed var(--ink-line);border-radius:10px;color:var(--sub);font-size:13.5px;text-align:center}
  .add-proj:hover{background:var(--gray1);color:var(--text)}
  .archive-section{margin:12px 6px 0}
  .archive-title{font-size:12px;color:var(--sub2);padding:4px 10px;letter-spacing:.5px}
  .archived-row{opacity:.75}
  .archived-row:hover{background:var(--gray1)}

  /* ===== 主区 ===== */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:16px;min-width:0}
  .main-inner{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
  .main-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .main-head h2{font-size:16px;font-weight:600}
  .scope-tag{font-size:12.5px;color:var(--sub);background:var(--gray1);border-radius:8px;padding:3px 10px;cursor:pointer}
  .layout-toggle{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .layout-toggle button{border:none;background:transparent;padding:4px 11px;font-size:12.5px;color:var(--sub);cursor:pointer}
  .layout-toggle button+button{border-left:1px solid var(--line)}
  .layout-toggle button.active{background:var(--ink-soft);color:var(--text)}
  .main-head .spacer{flex:1}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:5px 12px;border-radius:20px;font-size:12.5px;color:var(--sub);border:1px solid var(--line)}
  .chip.active{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
  .date-filter{border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12.5px;color:var(--sub);background:var(--field);outline:none}
  .show-done{font-size:12.5px;color:var(--sub);display:flex;align-items:center;gap:5px;cursor:pointer;padding:0 4px}
  .show-done input{width:14px;height:14px;accent-color:var(--ink)}
  .date-filter:focus{border-color:var(--ink);color:var(--text)}
  .navbtns{display:flex;gap:6px}
  .navbtns button{width:30px;height:30px;border-radius:8px;background:var(--gray1);color:var(--sub)}
  .navbtns button:hover{background:var(--gray2);color:var(--text)}

  /* 清单视图 */
  .listview{flex:1;overflow-y:auto;padding:14px 18px}
  .group-title{font-size:12.5px;color:var(--sub);margin:14px 4px 8px;display:flex;align-items:center;gap:8px}
  .group-title:first-child{margin-top:0}
  .sub-group-title{font-size:12.5px;color:var(--sub);margin:10px 4px 6px 18px}
  .trow{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--field);cursor:pointer}
  .trow:hover{border-color:var(--ink-line)}
  .trow.drag-over{outline:1.5px dashed var(--ink-line);outline-offset:-2px;border-color:var(--ink-line)}
  .pri{width:4px;align-self:stretch;border-radius:4px;background:transparent}
  .pri.high{background:var(--ink)}.pri.mid{background:var(--gray3)}.pri.low{background:var(--gray2)}
  .sdot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink-line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--on-ink)}
  .tree-chk,.chk{width:15px;height:15px;flex-shrink:0}
  .sdot.todo{background:var(--field)}
  .sdot.doing{background:var(--gray2);border-color:var(--gray2)}
  .sdot.done{background:var(--ink);border-color:var(--ink)}
  .trow.done .ttitle{text-decoration:line-through;color:var(--sub2)}
  .tbody{flex:1;min-width:0}
  .ttitle{font-size:14.5px}
  .tmeta{font-size:12px;color:var(--sub);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
  .tmeta .due{color:var(--text)}
  .tmeta .path{color:var(--sub2);border-left:1px solid var(--line);padding-left:9px;margin-left:2px}
  .tmeta .overdue{color:var(--text);font-weight:600}
  .tright{display:flex;align-items:center;gap:8px;color:var(--sub)}
  .empty{padding:60px;text-align:center;color:var(--sub2);font-size:14px}

  /* 月历 */
  .cal{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .cal-week{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
  .cal-week div{text-align:center;font-size:12.5px;color:var(--sub);padding:8px 0}
  .cal-grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;overflow-y:auto}
  .day{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;min-height:108px;position:relative}
  .day:nth-child(7n){border-right:none}
  .day:hover{background:var(--hover)}
  .day.drop-hint{background:var(--ink-soft)}
  .day.other{background:var(--hover)}.day.other .dnum{color:var(--sub2)}
  .day.today .dnum{background:var(--ink);color:var(--on-ink);border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
  .dnum{font-size:13px;font-weight:600;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
  .day.other .dnum{width:auto;height:auto;display:inline-flex}
  .cards{display:flex;flex-direction:column;gap:4px;margin-top:6px}
  .tcard{font-size:12.5px;padding:5px 8px;border-radius:7px;color:var(--on-ink);cursor:grab;line-height:1.3;background:var(--ink)}
  .tcard.g1{background:#3f3f46}.tcard.g2{background:#52525b}.tcard.g3{background:#71717a}
  .tcard .time{font-size:11px;opacity:.75}.tcard.done{opacity:.55}
  .tcard.due{background:transparent;color:var(--sub);border:1px dashed var(--ink-line);cursor:pointer;font-size:12px;padding:3px 8px;margin-top:2px}
  .tcard-top{display:flex;align-items:center;gap:6px}
  .cdot{width:13px;height:13px;border-radius:50%;border:1.5px solid rgba(255,255,255,.6);display:inline-flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0}
  .cdot.doing{background:rgba(255,255,255,.35)}
  .cdot.done{background:#fff;color:#18181b;border-color:#fff}
  .ctitle{margin-top:1px}

  /* 本周列表 */
  .weekview{flex:1;overflow-y:auto;padding:14px 18px}
  .dayview{flex:1;overflow-y:auto;padding:14px 18px}
  .day-bar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .day-wk{font-size:15px;font-weight:600}
  .day-count{font-size:12.5px;color:var(--sub)}
  .day-add-btn{margin-left:auto}
  .wday{margin-bottom:14px}
  .week-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .wk-btn{font-size:13px;color:var(--sub);border:1px solid var(--line);border-radius:8px;padding:5px 11px;background:var(--field)}
  .wk-btn:hover{color:var(--text);background:var(--gray1)}
  .wk-label{flex:1;text-align:center;font-size:13.5px;font-weight:600;color:var(--text)}
  .wk-today{margin-left:auto}
  .wday h4{font-size:13.5px;margin-bottom:8px;color:var(--sub);display:flex;align-items:center;gap:8px}
  .wday-add{margin-left:auto;width:22px;height:22px;border-radius:6px;font-size:15px;line-height:1;color:var(--sub);background:var(--gray1)}
  .wday-add:hover{color:var(--text);background:var(--gray2)}
  .wday.selected{background:var(--ink-soft);border-radius:10px;padding:6px 10px;margin:-6px -10px}
  .day.selected{background:var(--ink-soft);box-shadow:inset 2px 0 0 var(--ink)}
  .day-add{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:6px;font-size:14px;line-height:1;color:var(--sub);background:transparent;opacity:0;transition:.15s}
  .day:hover .day-add{opacity:1}
  .day-add:hover{color:var(--text);background:var(--gray2)}
  .wday.today h4{color:var(--text)}
  .wday.drop-hint{background:var(--ink-soft);border-radius:12px}

  /* ===== 抽屉 ===== */
  .mask{position:fixed;inset:0;background:rgba(20,20,22,.28);opacity:0;pointer-events:none;transition:.2s;z-index:30}
  .mask.open{opacity:1;pointer-events:auto}
  /* ===== 详情弹窗（查看态卡片 / 编辑态） ===== */
  .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
  .modal.open{display:flex}
  .modal-card{background:var(--panel);border-radius:18px;width:100%;max-width:560px;max-height:86vh;overflow-y:auto;box-shadow:0 16px 50px rgba(0,0,0,.2);padding:20px 22px}
  .modal.sm .modal-card{max-width:380px}
  .ctx-menu{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:6px;min-width:132px}
  .ctx-menu button{display:block;width:100%;text-align:left;padding:8px 12px;border:none;background:transparent;border-radius:8px;font-size:13.5px;color:var(--text);cursor:pointer}
  .ctx-menu button:hover{background:var(--gray1)}
  .d-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .d-head h3{font-size:14px;color:var(--sub);font-weight:500;flex:1}
  .d-close{font-size:20px;color:var(--sub)}
  .d-title-view{font-size:20px;font-weight:700;line-height:1.4;margin:4px 0 12px;word-break:break-word}
  .d-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .badge{font-size:12px;padding:3px 10px;border-radius:20px;background:var(--gray1);color:var(--sub)}
  .badge.b-ink{background:var(--ink);color:var(--on-ink)}
  .badge.editable{cursor:pointer}
  .badge.editable:hover{background:var(--gray2)}
  .inline-input{border:1px solid var(--ink-line);border-radius:8px;padding:3px 8px;font-size:12.5px;outline:none;background:var(--field);color:var(--text)}
  .title-edit{font-size:20px;font-weight:700;padding:6px 2px;width:100%}
  .desc-edit{min-height:80px;resize:vertical;width:100%;line-height:1.7;font-size:14.5px}
  .status-seg{display:inline-flex;background:var(--gray1);border-radius:10px;padding:3px;gap:2px;margin:2px 0 12px}
  .status-seg button{padding:6px 12px;border-radius:8px;font-size:13px;color:var(--sub)}
  .status-seg button.active{background:var(--ink);color:var(--on-ink);font-weight:500}
  .sec-label{font-size:12.5px;color:var(--sub);margin:16px 0 6px}
  .place-hint{font-size:12.5px;color:var(--sub);background:var(--gray1);border-radius:9px;padding:7px 11px;margin-bottom:12px}
  .desc-view{font-size:14.5px;line-height:1.7;white-space:pre-wrap;color:var(--text)}
  .desc-empty{color:var(--sub2);font-size:13.5px}
  .img-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .img-grid .thumb{width:84px;height:84px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
  .att{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-top:6px;font-size:13px}
  .att .an{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .remark-box{margin-top:14px;padding:12px;background:var(--gray1);border-radius:10px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;color:var(--text)}
  .d-foot{display:flex;gap:10px;margin-top:20px;justify-content:flex-end;align-items:center}
  .link-btn{font-size:13px;color:var(--sub);padding:8px 10px}
  .link-btn:hover{color:var(--text)}
  /* 编辑态 */
  .ed-field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
  .ed-field label{font-size:12.5px;color:var(--sub)}
  .ed-field input,.ed-field select,.ed-field textarea{border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:none;background:var(--field);color:var(--text)}
  .ed-field input:focus,.ed-field select:focus,.ed-field textarea:focus{border-color:var(--ink)}
  .ed-field textarea{resize:vertical;min-height:80px}
  .ed-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .attach-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .add-chip{border:1px dashed var(--ink-line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--sub);cursor:pointer}
  .add-chip:hover{background:var(--gray1);color:var(--text)}
  .mini-x{color:var(--sub);font-size:15px;cursor:pointer}
  .move-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer}
  .move-item:hover{background:var(--gray1)}
  .exp-hint{font-size:12.5px;color:var(--sub);margin-bottom:10px;line-height:1.6}
  .exp-filters{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 10px;font-size:13px;color:var(--sub)}
  .ai-test-row{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
  .test-result{font-size:12.5px}
  .test-result.ok{color:#1a7f37}
  .test-result.err{color:#c0392b}
  .mini.ai-off{opacity:.35;pointer-events:none}
  .exp-filters label{display:flex;align-items:center;gap:5px;cursor:pointer}
  .exp-filters input{width:14px;height:14px;accent-color:var(--ink)}
  .exp-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .exp-all{display:flex;align-items:center;gap:8px;font-size:13px}
  #expFmt{border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:13px;background:var(--field);color:var(--text);outline:none}
  .exp-list{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow-y:auto;margin-bottom:6px}
  .exp-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;font-size:13px}
  .exp-item .meta{margin-left:auto;font-size:11.5px;color:var(--sub);white-space:nowrap}

  /* ===== AI 弹窗 ===== */
  .aimodal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
  .aimodal.open{display:flex}
  .aimodal .mask2{position:absolute;inset:0;background:rgba(20,20,22,.28)}
  .ai-card{position:relative;background:var(--panel);border-radius:16px;width:100%;max-width:620px;max-height:86vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.18)}
  .ai-head{padding:18px 20px 10px;display:flex;align-items:center;gap:10px}
  .ai-head h3{font-size:16px;flex:1}
  .ai-head .close{font-size:20px;color:var(--sub)}
  .ai-body{padding:6px 20px;overflow-y:auto;flex:1}
  .ai-target{font-size:12.5px;color:var(--sub);margin-bottom:8px}
  .ai-body textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:11px;resize:vertical;outline:none;background:var(--field);color:var(--text)}
  .ai-opts{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);margin:8px 0}
  .ai-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .ai-item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .ai-item input[type=text]{flex:1;border:none;outline:none;font-size:14px;background:transparent;color:var(--text)}
  .ai-item input[type=date],.ai-item select{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px;background:var(--field);color:var(--text)}
  .ai-item .rm{color:var(--sub);font-size:16px;width:24px}
  .ai-empty{font-size:13px;color:var(--sub2);padding:14px;text-align:center}
  .ai-foot{padding:14px 20px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line)}

  .toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:9px 18px;border-radius:10px;font-size:13.5px;opacity:0;transition:.2s;z-index:60}
  .toast.show{opacity:1}

  @media(max-width:860px){
    .menu-btn{display:flex;align-items:center;justify-content:center}
    .sidebar{position:absolute;z-index:25;height:100%;margin-left:-290px;box-shadow:4px 0 20px rgba(0,0,0,.12)}

    .toolbar-actions .btn{padding:8px 10px}
  }
</style>
</head>
<body>

<!-- 事项详情弹窗（查看态卡片 / 编辑态） -->

<div class="modal sm" id="exportModal"><div class="modal-card sm">

<script>
/* ================= 数据模型 v3 ================= */
const LS='taskflow_v4';
const seed={
  projects:[{id:'p1',name:'工作',shade:0},{id:'p2',name:'个人',shade:1},{id:'p3',name:'学习',shade:2}],
  folders:[
    {id:'f1',projectId:'p1',name:'需求评审'},{id:'f2',projectId:'p1',name:'项目A 开发'},
    {id:'f3',projectId:'p2',name:'生活琐事'},{id:'f4',projectId:'p3',name:'技术精进'}
  ],
  tasks:[
    {id:'t1',title:'需求评审会',projectId:'p1',folderId:'f1',status:'todo',priority:'high',planDate:'2026-11-20',dueDate:'',start:'10:00',end:'11:30',note:'对齐项目A范围，输出评审纪要。'},
    {id:'t2',title:'接口联调',projectId:'p1',folderId:'f2',status:'doing',priority:'mid',planDate:'2026-11-20',dueDate:'',start:'14:00',end:'16:00',note:'与前端确认鉴权字段。'},
    {id:'t3',title:'周末采购',projectId:'p2',folderId:'f3',status:'todo',priority:'low',planDate:'2026-11-22',dueDate:'',start:'09:30',end:'11:00',note:'猫粮、猫砂、日用品。'},
    {id:'t4',title:'阅读《DDD 设计》第4章',projectId:'p3',folderId:'f4',status:'done',priority:'mid',planDate:'2026-11-21',dueDate:'',start:'20:00',end:'21:30',note:'沉淀领域模型笔记。'},
    {id:'t5',title:'周会汇报',projectId:'p1',folderId:'f1',status:'todo',priority:'mid',planDate:'',dueDate:'2026-11-24',start:'',end:'',note:'准备本周进度PPT。'},
    {id:'t6',title:'个人网站需求大纲',projectId:'p2',folderId:'',status:'todo',priority:'high',planDate:'',dueDate:'',start:'',end:'',note:'未排期，先列想法。'}
  ]
};
let data=load();
function normalizeTask(t){
  t.desc=t.desc||t.note||''; t.remark=t.remark||'';
  t.images=t.images||[]; t.attachments=t.attachments||[];
  t.status=t.status||'todo'; t.priority=t.priority||'';
  t.planDate=t.planDate||''; t.dueDate=t.dueDate||''; t.start=t.start||''; t.end=t.end||'';
  return t;
}
function load(){let raw;try{raw=localStorage.getItem(LS);}catch(e){}
  let obj=null;
  if(raw){try{obj=JSON.parse(raw);}catch(e){obj=null;}}
  if(!obj||!Array.isArray(obj.projects)||!Array.isArray(obj.tasks))obj=JSON.parse(JSON.stringify(seed));
  obj.folders=obj.folders||[];
  (obj.projects||[]).forEach(p=>p.archived=!!p.archived);
  (obj.folders||[]).forEach(f=>f.projectId=f.projectId||'');
  (obj.tasks||[]).forEach(normalizeTask);
  return obj;}
function save(){localStorage.setItem(LS,JSON.stringify(data));}

/* ================= 设置（独立存储） ================= */
const SET_LS='taskflow_settings_v1';
const defaultSettings={ai:{apiKey:'',baseUrl:'',model:'gpt-4o'},defaultView:'list',theme:'soft'};
let settings=loadSettings();
function loadSettings(){
  let raw;try{raw=localStorage.getItem(SET_LS);}catch(e){}
  const o=raw?JSON.parse(raw):{};
  return {ai:Object.assign({},defaultSettings.ai,o.ai||{}),defaultView:o.defaultView||'list',theme:o.theme||'soft'};
}
function saveSettings(){localStorage.setItem(SET_LS,JSON.stringify(settings));}
function aiReady(){return!!(settings.ai&&settings.ai.apiKey&&settings.ai.apiKey.trim());}
function applyTheme(t){document.documentElement.dataset.theme=t||'soft';}
const THEMES=['soft','warm','blue','dark'];
const $=s=>document.querySelector(s);
const uid=p=>p+Math.random().toString(36).slice(2,7);
let curView='list', curUser=new Date(), editingId=null, batchMode=false;
let statusFilter='todo', scope=null, listLayout='group', showDone=false; // scope={type:'project'|'folder',id}; listLayout=group|flat
let dateFilter='';
let dayDate=fmt(new Date());
let selDay=fmt(new Date()); // 日历/本周当前选中的日子（新增落点）
const selected=new Set(); // key: 'p:'|'f:'|'t:'+id
const selKey=(type,id)=>type+':'+id;
let aiCtx={projectId:null,folderId:null,projectSplit:false};
let aiCandidates=[];

/* ================= 工具 ================= */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1600);}
function fmt(d){return d.toISOString().slice(0,10);}
function shadeOf(pid){const p=data.projects.find(p=>p.id===pid);return p?p.shade:0;}
function projArchived(pid){const p=data.projects.find(x=>x.id===pid);return!!(p&&p.archived);}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const STATUS={todo:'待办',doing:'进行中',done:'已完成'};
function statusMatch(t){
  if(statusFilter==='todo')return t.status==='todo';
  if(statusFilter==='doing')return t.status==='doing';
  if(statusFilter==='done')return t.status==='done';
  if(statusFilter==='unplanned')return !t.planDate&&!t.dueDate;
  return true;
}
function inScope(t){
  if(!scope)return true;
  if(scope.type==='project')return t.projectId===scope.id;
  return t.folderId===scope.id;
}
function filteredTasks(){
  const q=$('#searchInput').value.trim().toLowerCase();
  return data.tasks.filter(t=>{
    if(!statusMatch(t)||!inScope(t))return false;
    if(!showDone&&statusFilter!=='done'&&t.status==='done')return false;
    if(projArchived(t.projectId))return false;
    if(curView==='list'&&dateFilter&&statusFilter!=='unplanned'&&!(t.planDate===dateFilter||t.dueDate===dateFilter))return false;
    if(!q)return true;
    return t.title.toLowerCase().includes(q);
  });
}
// 作业区视图（日历/本周/日程）：不受状态筛选、已完成开关、日期筛选影响，只保留范围/归档/搜索
function boardTasks(){
  const q=$('#searchInput').value.trim().toLowerCase();
  return data.tasks.filter(t=>{
    if(!inScope(t))return false;
    if(projArchived(t.projectId))return false;
    if(q&&!t.title.toLowerCase().includes(q))return false;
    return true;
  });
}

/* ================= 左侧树 ================= */
function renderTree(){
  const tree=$('#tree');tree.innerHTML='';
  const all=document.createElement('div');
  all.className='row all-row'+(scope===null?' active':'');
  all.innerHTML=`<span class="f-icon">▦</span><span style="flex:1">全部事项(${data.tasks.length})</span>`;
  all.onclick=()=>{scope=null;renderScopeTag();renderAll();};
  tree.appendChild(all);
  data.projects.filter(p=>!p.archived).forEach(p=>{
    const pf=data.folders.filter(f=>f.projectId===p.id);
    const pt=data.tasks.filter(t=>t.projectId===p.id);
    const pnode=document.createElement('div');pnode.className='pnode open';pnode.dataset.id=p.id;
    pnode.innerHTML=`<div class="row" draggable="true" data-ptype="project" data-id="${p.id}">
        <input type="checkbox" class="tree-chk" data-ptype="project" data-id="${p.id}" ${selected.has(selKey('p',p.id))?'checked':''} style="display:${batchMode?'block':'none'}">
        <span class="caret">▶</span><span class="dot"></span><span class="pname">${esc(p.name)}(${pt.length})</span>
        <span class="row-actions">
          <button class="mini" title="新建分组 / 事项" data-act="new-menu" data-id="${p.id}">＋</button>
          <button class="mini${aiReady()?'':' ai-off'}" title="AI 拆分此项目（未配置 AI）" data-act="ai-split-proj" data-id="${p.id}">✂</button>
          <button class="mini" title="归档项目" data-act="archive-proj" data-id="${p.id}">⤓</button>
          <button class="mini" title="删除项目" data-act="del-proj" data-id="${p.id}">×</button>
        </span></div><div class="sub"></div>`;
    const sub=pnode.querySelector('.sub');
    const prow=pnode.querySelector('.row');
    if(scope&&scope.type==='project'&&scope.id===p.id)prow.classList.add('active');
    prow.onclick=e=>{if(e.target.closest('.mini')||e.target.closest('.tree-chk'))return;
      if(e.target.closest('.caret')){pnode.classList.toggle('open');return;}
      setScope({type:'project',id:p.id});};
    prow.addEventListener('dragstart',e=>{drag={type:'project',id:p.id};});
    pf.forEach(f=>{
      const ft=data.tasks.filter(t=>t.folderId===f.id);
      const fnode=document.createElement('div');fnode.className='fnode';fnode.dataset.id=f.id;
      fnode.innerHTML=`<div class="row" draggable="true" data-ptype="folder" data-id="${f.id}">
          <input type="checkbox" class="tree-chk" data-ptype="folder" data-id="${f.id}" ${selected.has(selKey('f',f.id))?'checked':''} style="display:${batchMode?'block':'none'}">
          <span class="f-icon">–</span><span style="flex:1">${esc(f.name)}(${ft.length})</span>
          <span class="row-actions">
            <button class="mini" title="在此分类下新建" data-act="new-task-folder" data-id="${f.id}">＋</button>
            <button class="mini${aiReady()?'':' ai-off'}" title="AI 拆分到本分类（未配置 AI）" data-act="ai-split-folder" data-id="${f.id}">✂</button>
            <button class="mini" title="删除分组" data-act="del-folder" data-id="${f.id}">×</button>
          </span></div>`;
      fnode.querySelector('.row').onclick=e=>{if(e.target.closest('.mini')||e.target.closest('.tree-chk'))return;setScope({type:'folder',id:f.id});};
      fnode.querySelector('.row').addEventListener('dragstart',e=>{drag={type:'folder',id:f.id};});
      if(scope&&scope.type==='folder'&&scope.id===f.id)fnode.querySelector('.row').classList.add('active');
      sub.appendChild(fnode);
    });
    tree.appendChild(pnode);
  });
  const archived=data.projects.filter(p=>p.archived);
  if(archived.length){
    const aw=document.createElement('div');aw.className='archive-section';
    aw.innerHTML=`<div class="archive-title">已归档 (${archived.length})</div>`;
    archived.forEach(p=>{
      const row=document.createElement('div');row.className='row archived-row';
      row.innerHTML=`<span class="f-icon">⤓</span><span style="flex:1;color:var(--sub2)">${esc(p.name)}</span>
        <span class="row-actions">
          <button class="mini" title="恢复项目" data-act="unarchive-proj" data-id="${p.id}">↺</button>
          <button class="mini" title="删除项目" data-act="del-proj" data-id="${p.id}">×</button>
        </span>`;
      aw.appendChild(row);
    });
    tree.appendChild(aw);
  }
  tree.querySelectorAll('[data-act]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.id;
    if(b.dataset.act==='new-menu')openProjMenu(id,b);
    else if(b.dataset.act==='new-task-folder'){const f=data.folders.find(f=>f.id===id);openNew(f.id,f.projectId);}
    else if(b.dataset.act==='ai-split-proj')openAI({projectId:id,folderId:null,projectSplit:true});
    else if(b.dataset.act==='ai-split-folder'){const f=data.folders.find(f=>f.id===id);openAI({projectId:f.projectId,folderId:id,projectSplit:false});}
    else if(b.dataset.act==='archive-proj')archiveProj(id);
    else if(b.dataset.act==='unarchive-proj')unarchiveProj(id);
    else if(b.dataset.act==='del-proj')delProj(id);
    else if(b.dataset.act==='del-folder')delFolder(id);
  });
}
function moveInArray(arr,fromId,toId){
  const fi=arr.findIndex(x=>x.id===fromId),ti=arr.findIndex(x=>x.id===toId);
  if(fi<0||ti<0||fi===ti)return false;
  const [it]=arr.splice(fi,1);
  arr.splice(ti>fi?ti-1:ti,0,it);return true;
}
function handleTreeDrop(src,tgtType,tgtId){
  if(!src||src.id===tgtId)return;
  let moved=false;
  if(src.type==='project'&&tgtType==='project'){moved=moveInArray(data.projects,src.id,tgtId);}
  else if(src.type==='folder'&&tgtType==='folder'){
    const sf=data.folders.find(f=>f.id===src.id),tf=data.folders.find(f=>f.id===tgtId);
    if(!sf||!tf)return;
    if(sf.projectId!==tf.projectId)sf.projectId=tf.projectId;
    moved=moveInArray(data.folders,src.id,tgtId);
  }
  else if(src.type==='folder'&&tgtType==='project'){data.folders.find(f=>f.id===src.id).projectId=tgtId;moved=true;}
  else if(src.type==='task'&&tgtType==='folder'){const t=data.tasks.find(x=>x.id===src.id),f=data.folders.find(x=>x.id===tgtId);if(!t||!f)return;t.projectId=f.projectId;t.folderId=f.id;moved=true;}
  else if(src.type==='task'&&tgtType==='project'){const t=data.tasks.find(x=>x.id===src.id);if(!t)return;t.projectId=tgtId;t.folderId='';moved=true;}
  else if(src.type==='task'&&tgtType==='task'){const st=data.tasks.find(x=>x.id===src.id),tt=data.tasks.find(x=>x.id===tgtId);if(!st||!tt)return;st.projectId=tt.projectId;st.folderId=tt.folderId;moved=moveInArray(data.tasks,src.id,tgtId);}
  if(moved){save();renderAll();toast('已调整');}
}

function delTask(id){const t=data.tasks.find(x=>x.id===id);if(!t)return;
  if(!confirm('删除事项「'+t.title+'」？此操作不可撤销。'))return;
  data.tasks=data.tasks.filter(x=>x.id!==id);selected.delete(selKey('t',id));save();renderAll();toast('已删除事项');}
function delFolder(id){const f=data.folders.find(x=>x.id===id);if(!f)return;
  const n=data.tasks.filter(t=>t.folderId===id).length;
  const msg=n?`删除分组「${f.name}」？\n其中 ${n} 个事项会保留在项目下（不再归组）。`:`删除分组「${f.name}」？`;
  if(!confirm(msg))return;
  data.tasks.forEach(t=>{if(t.folderId===id)t.folderId='';});
  data.folders=data.folders.filter(x=>x.id!==id);
  selected.delete(selKey('f',id));
  if(scope&&scope.type==='folder'&&scope.id===id)scope=null;
  save();renderScopeTag();renderAll();toast('已删除分组');}
function delProj(id){const p=data.projects.find(x=>x.id===id);if(!p)return;
  const fcount=data.folders.filter(f=>f.projectId===id).length;
  const ncount=data.tasks.filter(t=>t.projectId===id).length;
  if(!confirm(`删除项目「${p.name}」？\n将同时删除 ${fcount} 个分组、${ncount} 个事项，此操作不可撤销。`))return;
  const subF=data.folders.filter(f=>f.projectId===id).map(f=>f.id);
  const subT=data.tasks.filter(t=>t.projectId===id).map(t=>t.id);
  data.folders=data.folders.filter(f=>f.projectId!==id);
  data.tasks=data.tasks.filter(t=>t.projectId!==id);
  selected.delete(selKey('p',id));subF.forEach(f=>selected.delete(selKey('f',f)));subT.forEach(t=>selected.delete(selKey('t',t)));
  if(scope&&scope.type==='project'&&scope.id===id)scope=null;
  save();renderScopeTag();renderAll();toast('已删除项目');}
function archiveProj(id){const p=data.projects.find(x=>x.id===id);if(!p)return;

function renderMonth(){
  const v=$('#monthView');v.innerHTML='';
  const y=curUser.getFullYear(),m=curUser.getMonth();
  if(curView==='month')$('#mainTitle').textContent=`${y}年${m+1}月`;

  v.appendChild(wh);
  const grid=document.createElement('div');grid.className='cal-grid';
  const startOffset=new Date(y,m,1).getDay(),daysInMonth=new Date(y,m+1,0).getDate(),today=fmt(new Date());
  const cells=[];
  for(let i=0;i<startOffset;i++)cells.push(new Date(y,m,1-i));
  for(let d=1;d<=daysInMonth;d++)cells.push(new Date(y,m,d));
  while(cells.length%7!==0)cells.push(new Date(y,m+1,cells.length-daysInMonth-startOffset+1));

      c.onclick=()=>openDrawer(t.id);
      c.addEventListener('dragstart',e=>{drag={type:'task',id:t.id};});
      box.appendChild(c);
    });
    boardTasks().filter(t=>t.dueDate===iso&&t.planDate!==iso).forEach(t=>{
      const d=document.createElement('div');d.className='tcard due';
      d.innerHTML=`<div class="ctitle">⏰ ${esc(t.title)}</div>`;
      d.onclick=()=>openDrawer(t.id);
      box.appendChild(d);
    });
    day.addEventListener('dragover',e=>{e.preventDefault();day.classList.add('drop-hint');});
    day.addEventListener('dragleave',()=>day.classList.remove('drop-hint'));
    day.addEventListener('drop',e=>{e.preventDefault();day.classList.remove('drop-hint');
      if(drag&&drag.type==='task'){const t=data.tasks.find(t=>t.id===drag.id);t.planDate=iso;save();renderAll();toast('已排到 '+iso);}});
    day.addEventListener('click',e=>{if(e.target.closest('.tcard')||e.target.closest('.day-add'))return;selDay=iso;renderMonth();});
    grid.appendChild(day);
  });
  v.appendChild(grid);
}

function rowsOf(src){return src.map(t=>{const p=data.projects.find(x=>x.id===t.projectId),f=data.folders.find(x=>x.id===t.folderId);
    return {标题:t.title,状态:STATUS[t.status],优先级:{high:'高',mid:'中',low:'低'}[t.priority]||'无',项目:p?p.name:'',分类:f?f.name:'',计划日:t.planDate,截止日:t.dueDate,开始:t.start,结束:t.end,描述:t.desc,备注:t.remark,附件:(t.attachments||[]).map(a=>a.name).join(', ')};});}
function toCSV(rows){
  const headers=['标题','状态','优先级','项目','分类','计划日','截止日','开始','结束','描述','备注','附件'];
  const q=v=>{v=String(v??'');return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const lines=[headers.join(',')].concat(rows.map(r=>headers.map(h=>q(r[h])).join(',')));
  return '\uFEFF'+lines.join('\r\n');
}
function doExport(src,fmt){
  const rows=rowsOf(src);
  const a=document.createElement('a');
  if(fmt==='csv'){
    a.href=URL.createObjectURL(new Blob([toCSV(rows)],{type:'text/csv;charset=utf-8'}));
    a.download='事项导出_'+fmt(new Date())+'.csv';
  }else{
    a.href=URL.createObjectURL(new Blob([JSON.stringify(rows,null,2)],{type:'application/json'}));
    a.download='事项导出_'+fmt(new Date())+'.json';
  }
  a.click();toast('已导出 '+rows.length+' 条');}
let expSet=new Set(), expListTasks=[], expSt=new Set();
function updExpCount(){$('#expCount').textContent=expSet.size;}
function renderExpList(){
  const box=$('#expList');
  box.innerHTML=expListTasks.map(t=>`
    <label class="exp-item">
      <input type="checkbox" data-export="${t.id}" ${expSet.has(t.id)?'checked':''}>
      <span style="flex:1">${esc(t.title)}</span>
      <span class="meta">${esc(pName(t.projectId))}${t.folderId?' · '+esc(fName(t.folderId)):''}${t.planDate?' · '+t.planDate:''}</span>
    </label>`).join('');
  box.querySelectorAll('input').forEach(c=>c.onchange=()=>{c.checked?expSet.add(c.dataset.export):expSet.delete(c.dataset.export);updExpCount();});
  $('#expAll').checked=expListTasks.length>0&&expSet.size===expListTasks.length;
  updExpCount();
}
$('#expAll').onchange=e=>{expSet=e.target.checked?new Set(expListTasks.map(t=>t.id)):new Set();renderExpList();};
function expCandidate(){
  const q=$('#searchInput').value.trim().toLowerCase();
  return data.tasks.filter(t=>{
    if(projArchived(t.projectId))return false;
    const key=t.status==='done'?'done':(t.status==='doing'?'doing':'todo');
    const unplanned=!t.planDate&&!t.dueDate;
    if(!(expSt.has(key)||(unplanned&&expSt.has('unplanned'))))return false;
    if(!inScope(t))return false;
    if(dateFilter&&!(t.planDate===dateFilter||t.dueDate===dateFilter))return false;
    if(q&&!t.title.toLowerCase().includes(q))return false;
    return true;
  });
}
const EXP_ST={todo:'待办',doing:'进行中',done:'已完成',unplanned:'未规划'};
function expHintText(){return '导出状态：'+[...expSt].map(s=>EXP_ST[s]).join('、')+'（可勾选调整，再逐条增减）';}
function rebuildExp(){
  expListTasks=expCandidate();
  const picked=new Set(selectedTaskIds());
  expSet=new Set(expListTasks.filter(t=>!selected.size||picked.has(t.id)).map(t=>t.id));
  $('#expHint').textContent=expHintText();
  renderExpList();
}
document.querySelectorAll('.exp-st').forEach(c=>c.onchange=()=>{
  c.checked?expSt.add(c.dataset.st):expSt.delete(c.dataset.st);
  rebuildExp();
});
$('#exportBtn').onclick=()=>{
  expSt=new Set();
  if(statusFilter==='todo'||statusFilter==='doing'||statusFilter==='done')expSt.add(statusFilter);
  else if(statusFilter==='unplanned')expSt.add('unplanned');
  else expSt=new Set(['todo','doing','done','unplanned']);
  document.querySelectorAll('.exp-st').forEach(c=>c.checked=expSt.has(c.dataset.st));
  rebuildExp();
  $('#exportModal').classList.add('open');
};
$('#exportModal').onclick=e=>{
  if(e.target.closest('[data-xclose]'))return $('#exportModal').classList.remove('open');
  if(e.target.closest('[data-xok]')){
    const src=expListTasks.filter(t=>expSet.has(t.id));
    if(!src.length)return toast('先勾选要导出的事项');
    doExport(src,$('#expFmt').value);$('#exportModal').classList.remove('open');
  }
};

function openAI(ctx){
  if(!aiReady()){toast('请先在左下角设置中配置 AI API Key');return;}
  aiCtx=Object.assign({projectId:null,folderId:null,projectSplit:false},ctx||{});aiCandidates=[];
  const p=aiCtx.projectId?data.projects.find(p=>p.id===aiCtx.projectId):null;

  $('#aiStage').checked=!!aiCtx.projectSplit;$('#aiDesc').value='';renderAICandidates();
  $('#aiModal').classList.add('open');}
function closeAI(){$('#aiModal').classList.remove('open');aiCandidates=[];}
$('#aiClose').onclick=closeAI;$('#aiCancel').onclick=closeAI;$('#aiMask').onclick=closeAI;
function mockSplit(desc){
  let parts=desc.split(/[\n；;。！?！？]/).map(s=>s.trim()).filter(Boolean);
  if(parts.length<2){const b=desc.trim()||'目标';
    parts=['明确「'+b+'」的目标与范围','拆解关键步骤与依赖','制定执行与排期计划','逐项执行并记录进展','检查验收与复盘'];}
  const today=fmt(new Date());
  return parts.slice(0,8).map(p=>({title:p.length>30?p.slice(0,30)+'…':p,planDate:today,priority:'mid',checked:true}));
}
$('#aiGen').onclick=()=>{const desc=$('#aiDesc').value.trim();if(!desc)return toast('先输入目标或任务描述');
  aiCandidates=mockSplit(desc);renderAICandidates();toast('已生成 '+aiCandidates.length+' 条候选，可编辑/勾选');};
function renderAICandidates(){const list=$('#aiList');list.innerHTML='';
  if(!aiCandidates.length){list.innerHTML='<div class="ai-empty">生成后候选列在此，确认勾选再录入</div>';}
  aiCandidates.forEach((c,i)=>{
    const row=document.createElement('div');row.className='ai-item';
    row.innerHTML=`<input type="checkbox" ${c.checked?'checked':''} data-i="${i}">
      <input type="text" value="${esc(c.title)}" data-i="${i}">
      <select data-i="${i}"><option value="">优先级</option><option value="high">高</option><option value="mid">中</option><option value="low">低</option></select>
      <input type="date" value="${c.planDate||''}" data-i="${i}">
      <button class="rm" data-i="${i}">×</button>`;
    row.querySelector('input[type=checkbox]').onchange=e=>{aiCandidates[i].checked=e.target.checked;updAi();};
    row.querySelector('input[type=text]').oninput=e=>aiCandidates[i].title=e.target.value;
    row.querySelector('select').onchange=e=>aiCandidates[i].priority=e.target.value;
    row.querySelector('input[type=date]').onchange=e=>aiCandidates[i].planDate=e.target.value;
    row.querySelector('.rm').onclick=()=>{aiCandidates.splice(i,1);renderAICandidates();};
    list.appendChild(row);
  });
  updAi();}
function updAi(){$('#aiCount').textContent=aiCandidates.filter(c=>c.checked&&c.title.trim()).length;}
$('#aiConfirm').onclick=()=>{const picked=aiCandidates.filter(c=>c.checked&&c.title.trim());
  if(!picked.length)return toast('没有可录入的候选');
  let pid=aiCtx.projectId||(data.projects[0]&&data.projects[0].id),fid=aiCtx.folderId||'';
  const stage=$('#aiStage').checked&&aiCtx.projectSplit;
  picked.forEach(c=>{let folderId=fid;
    if(stage){const f={id:uid('f'),projectId:pid,name:c.title.slice(0,12)};data.folders.push(f);folderId=f.id;}
    data.tasks.push({id:uid('t'),title:c.title.trim(),projectId:pid,folderId:folderId,status:'todo',priority:c.priority||'',planDate:c.planDate||'',dueDate:'',start:'',end:'',desc:'AI 拆分生成'});});
  save();closeAI();renderAll();toast('已录入 '+picked.length+' 条');};

/* ================= 视图切换 / 筛选 / 导航 ================= */
function showView(){
  $('#listView').style.display=curView==='list'?'block':'none';
  $('#monthView').style.display=curView==='month'?'flex':'none';
  $('#weekView').style.display=curView==='week'?'block':'none';
  $('#dayView').style.display=curView==='day'?'block':'none';
  $('#calNav').style.display=curView==='month'?'flex':'none';
  $('#dateFilter').style.display=curView==='list'?'':'none';
  $('#mainTitle').textContent=curView==='month'?'日历':curView==='week'?'本周':curView==='day'?'日程':'清单';
}
$('#viewSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  curView=b.dataset.view;
  document.querySelectorAll('#viewSeg button').forEach(x=>x.classList.toggle('active',x===b));
  showView();
  renderAll();});
$('#statusChips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;
  statusFilter=b.dataset.f;
  document.querySelectorAll('#statusChips .chip').forEach(x=>x.classList.toggle('active',x===b));
  renderAll();});
$('#prevM').onclick=()=>{curUser.setMonth(curUser.getMonth()-1);renderMonth();};
$('#nextM').onclick=()=>{curUser.setMonth(curUser.getMonth()+1);renderMonth();};
$('#todayM').onclick=()=>{curUser=new Date();renderMonth();};
$('#searchInput').oninput=renderAll;
$('#dateFilter').value=dateFilter;
$('#dateFilter').oninput=e=>{dateFilter=e.target.value;renderAll();};
$('#showDone').onchange=e=>{showDone=e.target.checked;renderAll();};
$('#menuBtn').onclick=()=>document.body.classList.toggle('nav-open');

/* ================= 设置弹窗 ================= */
$('#settingBtn').onclick=()=>{
  $('#setApiKey').value=settings.ai.apiKey||'';
  $('#setBaseUrl').value=settings.ai.baseUrl||'';
  $('#setModel').value=settings.ai.model||'gpt-4o';
  $('#setDefaultView').value=settings.defaultView||'list';
  $('#setTheme').value=THEMES.includes(settings.theme)?settings.theme:'soft';
  const r=$('#aiTestResult');r.textContent='';r.className='test-result';
  $('#settingsModal').classList.add('open');
};
$('#setTheme').onchange=e=>applyTheme(e.target.value);
$('#aiTest').onclick=()=>{
  const key=$('#setApiKey').value.trim();
  const res=$('#aiTestResult');
  if(!key){res.textContent='请先填写 API Key';res.className='test-result err';return;}
  $('#aiTest').textContent='测试中…';
  setTimeout(()=>{
    $('#aiTest').textContent='测试连通性';
    res.textContent='✓ 连接成功（原型本地校验，未真实发起请求）';res.className='test-result ok';
  },700);
};
$('#setSave').onclick=()=>{
  settings.ai.apiKey=$('#setApiKey').value.trim();
  settings.ai.baseUrl=$('#setBaseUrl').value.trim();
  settings.ai.model=$('#setModel').value;
  settings.defaultView=$('#setDefaultView').value;
  settings.theme=THEMES.includes($('#setTheme').value)?$('#setTheme').value:'soft';
  applyTheme(settings.theme);
  saveSettings();renderAll();toast('设置已保存');
  $('#settingsModal').classList.remove('open');
};
$('#settingsModal').onclick=e=>{if(e.target.closest('[data-setclose]')){applyTheme(settings.theme);$('#settingsModal').classList.remove('open');}};

function updateLayoutToggle(){
  const bar=$('#layoutToggle');
  bar.style.display=(curView==='list'&&!scope)?'inline-flex':'none';
  bar.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.layout===listLayout));
}
$('#layoutToggle').onclick=e=>{const b=e.target.closest('[data-layout]');if(!b)return;listLayout=b.dataset.layout;updateLayoutToggle();renderList();};
function renderAll(){renderTree();renderList();renderMonth();renderWeek();renderDay();updateLayoutToggle();}
applyTheme(settings.theme);
if(settings.defaultView&&['list','month','week','day'].includes(settings.defaultView)){
  curView=settings.defaultView;
  document.querySelectorAll('#viewSeg button').forEach(x=>x.classList.toggle('active',x.dataset.view===curView));
}
showView();
renderAll();
</script>
</body>
</html>
